[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-rundown"
version = "0.1.0"
description = "A personal, local Slack digest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "slack-sdk>=3.33,<4", "httpx>=0.27,<1", "pydantic>=2.9,<3", "filelock>=3.16,<4", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
rundown = "rundown.__main__:main"

[tool.setuptools.package-data]
rundown = ["static/*"]

[tool.setuptools.packages.find]
include = ["rundown*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
